name: Build Mac Client

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'client_mac/**'
      - '.github/workflows/build_mac.yml'
  workflow_dispatch:  # 允许手动在 GitHub 网页上点击运行

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd client_mac
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS executable (Universal2)
        run: |
          cd client_mac
          # 使用 universal2 架构，兼容 Intel 和 M1/M2/M3 (Apple Silicon)
          pyinstaller --onefile --windowed --target-arch universal2 -n MacInfoCollector mac_main.py
          
          # 打包为 zip 以便下载，保持 .app 内的文件权限
          cd dist
          zip -r MacInfoCollector.zip MacInfoCollector.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacInfoCollector-Universal-App
          path: client_mac/dist/MacInfoCollector.zip
          retention-days: 7
